name: Awesome lint

# Checks README.md against the official awesome-list rules (sindresorhus/awesome-lint).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: npx --yes awesome-lint
